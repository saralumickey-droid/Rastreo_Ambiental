
services:
  db:
    image: postgres:16
    container_name: rastreo_ambiental_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rastreo_ambiental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rastreo_ambiental"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rastreo_ambiental_api
    restart: unless-stopped
    environment:
      APP_NAME: Rastreo Ambiental API
      APP_VERSION: "1.0.0"
      API_PREFIX: /api
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/rastreo_ambiental
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ALGORITHM: HS256
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
